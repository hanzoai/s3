# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    # The door, not buildx on the runner. It schedules one BuildKit Job per
    # platform and the cluster holds a node of each, so the arm64 half of
    # `platforms:` in hanzo.yml is a native compile on spark instead of qemu on
    # an amd64 runner. The gate still runs here; what this skips is buildx.
    with:
      mode: delegate
    secrets: inherit
