name: Build

# Self-contained multi-arch image build for the public s3 repo.
#
# Replaces the previous `uses: hanzoai/.github/.github/workflows/docker-build.yml@main`
# call: a PUBLIC repo cannot call a reusable workflow that lives in a PRIVATE repo
# (GitHub resolves it as "workflow was not found"), so every docker-build here failed
# at 0s. This builds and pushes directly with GITHUB_TOKEN — no cross-repo reusable,
# no custom registry secret — and produces linux/amd64 + linux/arm64.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # amd64 self-hosted runner (evo); arm64 is produced via buildx/QEMU since the
    # Dockerfile is pure-Go (CGO_ENABLED=0) and cross-builds cleanly.
    runs-on: [self-hosted, linux, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanzoai/s3
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
