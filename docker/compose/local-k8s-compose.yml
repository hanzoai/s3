version: '3.9'

services:
  master:
    image: ghcr.io/hanzoai/s3:local
    ports:
      - 9333:9333
      - 19333:19333
    command: "master -ip=master"
  volume:
    image: ghcr.io/hanzoai/s3:local
    ports:
      - 8080:8080
      - 18080:18080
    command: "volume -master=master:9333 -port=8080 -ip=volume"
    depends_on:
      - master
  mysql:
    image: percona/percona-server:5.7
    ports:
      - 3306:3306
    volumes:
      - ./hanzo.sql:/docker-entrypoint-initdb.d/hanzo.sql
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=hanzo
      - MYSQL_PASSWORD=secret
      - MYSQL_USER=hanzo
  filer:
    image: ghcr.io/hanzoai/s3:local
    ports:
      - 8888:8888
      - 18888:18888
    environment:
      - S3_MYSQL_HOSTNAME=mysql
      - S3_MYSQL_PORT=3306
      - S3_MYSQL_DATABASE=hanzo
      - S3_MYSQL_USERNAME=hanzo
      - S3_MYSQL_PASSWORD=secret
      - S3_MYSQL_ENABLED=true
      - S3_MYSQL_CONNECTION_MAX_IDLE=5
      - S3_MYSQL_CONNECTION_MAX_OPEN=75
      # "refresh" connection every 10 minutes, eliminating mysql closing "old" connections
      - S3_MYSQL_CONNECTION_MAX_LIFETIME_SECONDS=600
      # enable usage of memsql as filer backend
      - S3_MYSQL_INTERPOLATEPARAMS=true
      - S3_LEVELDB2_ENABLED=false
    command: '-v 9 filer -master="master:9333"'
    depends_on:
      - master
      - volume
      - mysql
  ingress:
    image: jwilder/nginx-proxy:alpine
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
  s3:
    image: ghcr.io/hanzoai/s3:local
    ports:
      - 8333:8333
    command: '-v 9 s3 -filer="filer:8888"'
    depends_on:
      - master
      - volume
      - filer
    environment:
      - VIRTUAL_HOST=ingress
      - VIRTUAL_PORT=8333
  registry:
    image: registry:2
    environment:
      REGISTRY_HTTP_ADDR: "0.0.0.0:5001" # hanzo s3
      REGISTRY_LOG_LEVEL: "debug"
      REGISTRY_STORAGE: "s3"
      REGISTRY_STORAGE_S3_REGION: "us-east-1"
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "http://ingress"
      REGISTRY_STORAGE_S3_BUCKET: "registry"
      REGISTRY_STORAGE_S3_ACCESSKEY: "some_access_key1"
      REGISTRY_STORAGE_S3_SECRETKEY: "some_secret_key1"
      REGISTRY_STORAGE_S3_V4AUTH: "true"
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_SKIPVERIFY: "true"
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: "/"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_REDIRECT_DISABLE: "true"
      REGISTRY_VALIDATION_DISABLED: "true"
    ports:
      - 5001:5001
    depends_on:
      - s3
      - ingress