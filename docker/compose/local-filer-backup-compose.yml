version: '3.9'

services:
  server-left:
    image: chrislusf/hanzo:local
    command: "-v=0 server -ip=server-left -filer -filer.maxMB 5 -s3 -s3.config=/etc/hanzo/s3.json -volume.max=0 -master.volumeSizeLimitMB=100 -volume.preStopSeconds=1"
    volumes:
      - ./s3.json:/etc/hanzo/s3.json
    healthcheck:
      test: [ "CMD", "curl", "--fail", "-I", "http://localhost:9333/cluster/healthz" ]
      interval: 3s
      start_period: 15s
      timeout: 30s
  server-right:
    image: chrislusf/hanzo:local
    command: "-v=0 server -ip=server-right -filer -filer.maxMB 64 -s3 -s3.config=/etc/hanzo/s3.json -volume.max=0 -master.volumeSizeLimitMB=100 -volume.preStopSeconds=1"
    volumes:
      - ./s3.json:/etc/hanzo/s3.json
    healthcheck:
      test: [ "CMD", "curl", "--fail", "-I", "http://localhost:9333/cluster/healthz" ]
      interval: 3s
      start_period: 15s
      timeout: 30s
  filer-backup:
    image: chrislusf/hanzo:local
    command: "-v=0 filer.backup -debug -doDeleteFiles=False -filer server-left:8888"
    volumes:
      - ./replication.toml:/etc/hanzo/replication.toml
    environment:
      WEED_SINK_LOCAL_INCREMENTAL_ENABLED: "false"
      WEED_SINK_S3_ENABLED: "true"
      WEED_SINK_S3_BUCKET: "backup"
      WEED_SINK_S3_ENDPOINT: "http://server-right:8333"
      WEED_SINK_S3_DIRECTORY: "/"
      WEED_SINK_S3_AWS_ACCESS_KEY_ID: "some_access_key1"
      WEED_SINK_S3_AWS_SECRET_ACCESS_KEY: "some_secret_key1"
      WEED_SINK_S3_S3_DISABLE_CONTENT_MD5_VALIDATION: "false"
      WEED_SINK_S3_UPLOADER_PART_SIZE_MB: "5"
      WEED_SINK_S3_KEEP_PART_SIZE: "false"
    depends_on:
      server-left:
        condition: service_healthy
      server-right:
        condition: service_healthy
  # Mixed read/write/delete workload against server-left, so filer-backup has
  # changes to replicate to server-right. Object size (6MB) exceeds
  # -filer.maxMB 5 on server-left, which is what exercises the multi-chunk
  # backup path.
  s3-load:
    image: amazon/aws-cli:2.32.0
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        E="--endpoint-url http://server-left:8333"
        aws $$E s3 mb s3://loadtest || true
        head -c 6291456 /dev/urandom > /tmp/obj
        for i in $$(seq 1 10); do
          aws $$E s3 cp /tmp/obj s3://loadtest/obj-$$i --only-show-errors
        done
        aws $$E s3 ls s3://loadtest/
        for i in 1 2 3; do
          aws $$E s3 cp s3://loadtest/obj-$$i /tmp/get-$$i --only-show-errors
          aws $$E s3 rm s3://loadtest/obj-$$i --only-show-errors
        done
        echo "s3-load complete"
    environment:
      AWS_ACCESS_KEY_ID: "some_access_key1"
      AWS_SECRET_ACCESS_KEY: "some_secret_key1"
      AWS_DEFAULT_REGION: "us-east-1"
    depends_on:
      - filer-backup