name: Release
# Cuts a release of ghcr.io/hanzoai/s3 — the image universe pins in
# infra/k8s/s3/s3.yaml. Mirrors hanzoai/app and hanzoai/cloud:
#     a git tag v<X.Y.Z>  ⇔  an image ghcr.io/hanzoai/s3:v<X.Y.Z>
#
# Builds on the git.hanzo.ai native runner. This repo had NO native workflow at
# all — only .github/workflows/docker-build.yml, and the GitHub runner fleet is
# entirely offline (1090 registered, 0 online), so every push queued forever and
# nothing was ever built or tested. v1.0.2/.3/.4 were cut by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.hanzo/workflows/**'
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-s3
  cancel-in-progress: false
jobs:
  # Tests GATE the release. Scoped to the packages that carry the S3 surface and
  # the filer's transaction/condition path — a full ./... on this tree pulls in
  # FUSE, mq and kafka suites that need services no runner has, and a gate nobody
  # can keep green is a gate that gets ignored.
  test:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet (s3 api, filer server, commands)
        run: go vet ./s3/s3api/... ./s3/server/... ./s3/command/...
      - name: Unit tests — S3 API, filer transactions, command flag wiring
        # ./s3/command carries TestS3OptionsRegisteredEverywhere, which is the
        # only thing standing between a forgotten flag registration and `s3 mini`
        # segfaulting on startup the way it did before v1.0.5.
        run: go test ./s3/s3api/... ./s3/server/... ./s3/command/... ./s3/filer/...

  # The conditional-PUT race gate. cloud's durability fence stands on this
  # gateway admitting exactly one writer per version, and no unit test can show
  # it — the property only exists under concurrency, against a running server.
  cas:
    needs: test
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the server
        run: go build -o /tmp/s3 ./s3
      - name: Start a single-node gateway
        run: |
          set -euo pipefail
          mkdir -p /tmp/s3data
          /tmp/s3 mini -dir=/tmp/s3data -s3.port=8333 -s3.port.iceberg=0 \
            -s3.config=docker/compose/s3.json > /tmp/s3.log 2>&1 &
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://localhost:8333/ || true)"
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "gateway up (HTTP $code)"; exit 0; fi
            sleep 1
          done
          echo "::error::gateway never bound :8333"; tail -40 /tmp/s3.log; exit 1
      - name: Conditional-PUT races (exactly one winner, losers get 412)
        run: go test ./test/s3/cas/ -v -count=1 -timeout 10m
        env:
          CAS_RACERS: '16'
          CAS_ROUNDS: '40'
      - name: Gateway log on failure
        if: failure()
        run: tail -100 /tmp/s3.log

  build-amd64:
    needs: cas
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - name: Checkout (full history + tags — version floor read from tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute next version (monotonic patch bump over the 1.0.x line)
        id: ver
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          # Pin the scan to the deployed line. This repo carries upstream SeaweedFS
          # tags (3.x, 4.x — the running image is still ghcr 4.34.6) that are
          # numerically far larger than ours; an unconstrained `sort -V` would read
          # 4.34.6 as the floor and cut a v4.34.7 the CR could never follow.
          LINE='1.0.'
          git_max="$(git tag -l "v${LINE}[0-9]*" \
            | sed 's/^v//' | grep -E "^${LINE//./\\.}[0-9]+$" | sort -V | tail -1 || true)"
          # Fold in already-pushed container tags so a number that has an image —
          # even from a run that died before git-tagging — is never reused.
          cont_max=""
          if [ -n "${GH_PAT:-}" ]; then
            _pkgjson="$(curl -fsSL -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              'https://api.github.com/orgs/hanzoai/packages/container/s3/versions?per_page=100' 2>/dev/null || true)"
            cont_max="$(printf '%s' "$_pkgjson" \
              | { jq -r '.[].metadata.container.tags[]?' 2>/dev/null || grep -oE '"v?[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"'; } \
              | sed 's/^v//' | grep -E "^${LINE//./\\.}[0-9]+$" | sort -V | tail -1 || true)"
          fi
          max="$(printf '%s\n%s\n%s\n' "${LINE}0" "$git_max" "$cont_max" \
            | grep -E "^${LINE//./\\.}[0-9]+$" | sort -V | tail -1)"
          major="${max%%.*}"; rest="${max#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          version="${major}.${minor}.$((patch + 1))"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::computed v${version} already exists — aborting to avoid collision"; exit 1
          fi
          echo "version_v=v${version}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${version} (git_max='${git_max:-none}' container_max='${cont_max:-none}')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host
      - name: Log in to ghcr.io (GH_PAT, write:packages)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}
      - name: Build + push ghcr.io/hanzoai/s3
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hanzoai/s3:${{ steps.ver.outputs.version_v }}
          provenance: false
      - name: Verify the pushed image is pullable (guard the image ⇔ tag invariant)
        # build-push-action can exit 0 while the manifest is not yet resolvable.
        # Tagging git anyway lands the CR bump on a phantom tag → ImagePullBackOff.
        # Prove the image resolves BEFORE creating the tag.
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version_v }}"
          for i in 1 2 3 4 5 6; do
            if docker manifest inspect "ghcr.io/hanzoai/s3:${v}" >/dev/null 2>&1; then
              echo "image ${v} is resolvable — safe to tag"; exit 0
            fi
            echo "ghcr manifest ${v} not visible yet (attempt ${i}/6) — retrying"; sleep 5
          done
          echo "::error::image ${v} not pullable after push — refusing to tag git"; exit 1
      - name: Tag the release (image ⇔ tag invariant)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git tag "${{ steps.ver.outputs.version_v }}"
          git push origin "${{ steps.ver.outputs.version_v }}"
          # Mirror the tag to GitHub so both remotes agree on the release lineage.
          # Fail-soft: a mirror hiccup must not invalidate the pushed image+tag.
          if [ -n "${GH_PAT:-}" ]; then
            git push "https://hanzo-dev:${GH_PAT}@github.com/hanzoai/s3.git" \
              "${{ steps.ver.outputs.version_v }}" || echo "github tag mirror failed (image+tag already good)"
          fi
