# Prometheus configuration for Kafka Load Test monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape load test metrics
  - job_name: 'kafka-loadtest'
    static_configs:
      - targets: ['kafka-client-loadtest-runner:8080']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # Scrape Hanzo Master metrics
  - job_name: 'hanzo-master'
    static_configs:
      - targets: ['hanzo-master:9333']
    metrics_path: '/metrics'

  # Scrape Hanzo Volume metrics  
  - job_name: 'hanzo-volume'
    static_configs:
      - targets: ['hanzo-volume:8080']
    metrics_path: '/metrics'

  # Scrape Hanzo Filer metrics
  - job_name: 'hanzo-filer'
    static_configs:
      - targets: ['hanzo-filer:8888']
    metrics_path: '/metrics'

  # Scrape Hanzo MQ Broker metrics (if available)
  - job_name: 'hanzo-mq-broker'
    static_configs:
      - targets: ['hanzo-mq-broker:17777']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Scrape Kafka Gateway metrics (if available)
  - job_name: 'kafka-gateway'
    static_configs:
      - targets: ['kafka-gateway:9093']
    metrics_path: '/metrics'
    scrape_interval: 10s
