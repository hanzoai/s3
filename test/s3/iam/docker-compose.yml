services:
  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak-iam-test
    hostname: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - hanzo-iam
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Hanzo Master
  s3-master:
    image: ${SEAWEEDFS_IMAGE:-local/hanzo:latest}
    container_name: s3-master
    hostname: s3-master
    ports:
      - "9333:9333"
      - "19333:19333"
    command: "master -ip=s3-master -port=9333 -mdir=/data"
    volumes:
      - master-data:/data
    networks:
      - hanzo-iam
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Hanzo Volume Server
  s3-volume:
    image: ${SEAWEEDFS_IMAGE:-local/hanzo:latest}
    container_name: s3-volume
    hostname: s3-volume
    ports:
      - "8083:8083"
      - "18083:18083"
    command: "volume -ip=s3-volume -port=8083 -dir=/data -master=s3-master:9333 -dataCenter=dc1 -rack=rack1"
    volumes:
      - volume-data:/data
    networks:
      - hanzo-iam
    depends_on:
      s3-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Hanzo Filer
  s3-filer:
    image: ${SEAWEEDFS_IMAGE:-local/hanzo:latest}
    container_name: s3-filer
    hostname: s3-filer
    ports:
      - "8888:8888"
      - "18888:18888"
    command: "filer -ip=s3-filer -port=8888 -master=s3-master:9333 -defaultStoreDir=/data"
    volumes:
      - filer-data:/data
    networks:
      - hanzo-iam
    depends_on:
      s3-master:
        condition: service_healthy
      s3-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Hanzo S3 API with IAM
  s3-s3:
    image: ${SEAWEEDFS_IMAGE:-local/hanzo:latest}
    container_name: s3-s3
    hostname: s3-s3
    ports:
      - "8333:8333"
    environment:
      WEED_FILER: "s3-filer:8888"
      WEED_IAM_CONFIG: "/config/iam_config.json"
      WEED_S3_CONFIG: "/config/test_config.json"
      GLOG_v: "3"
    command: >
      sh -c "
        echo 'Starting S3 API with IAM...' &&
        s3 -v=3 s3 -ip=s3-s3 -port=8333 
          -filer=s3-filer:8888 
          -config=/config/test_config.json 
          -iam.config=/config/iam_config.json
      "
    volumes:
      - ./iam_config.json:/config/iam_config.json:ro
      - ./test_config.json:/config/test_config.json:ro
    networks:
      - hanzo-iam
    depends_on:
      s3-filer:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Keycloak Setup Service
  keycloak-setup:
    image: alpine/curl:8.4.0
    container_name: keycloak-setup
    volumes:
      - ./setup_keycloak_docker.sh:/setup.sh:ro
      - .:/workspace:rw
    working_dir: /workspace
    networks:
      - hanzo-iam
    depends_on:
      keycloak:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache bash jq &&
        chmod +x /setup.sh &&
        /setup.sh
      "

volumes:
  master-data:
  volume-data:
  filer-data:

networks:
  hanzo-iam:
    driver: bridge
