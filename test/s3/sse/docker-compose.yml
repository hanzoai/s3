services:
  # OpenBao server for KMS integration testing
  openbao:
    image: ghcr.io/openbao/openbao:latest
    ports:
      - "8200:8200"
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=root-token-for-testing
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - BAO_LOCAL_CONFIG={"backend":{"file":{"path":"/bao/data"}},"default_lease_ttl":"168h","max_lease_ttl":"720h","ui":true,"disable_mlock":true}
    command:
      - bao
      - server
      - -dev
      - -dev-root-token-id=root-token-for-testing
      - -dev-listen-address=0.0.0.0:8200
    volumes:
      - openbao-data:/bao/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - hanzo-sse-test

  # Hanzo Master
  hanzo-master:
    image: chrislusf/hanzo:latest
    ports:
      - "9333:9333"
      - "19333:19333"
    command: 
      - master
      - -ip=hanzo-master
      - -port=9333
      - -port.grpc=19333
      - -volumeSizeLimitMB=50
      - -mdir=/data
    volumes:
      - hanzo-master-data:/data
    networks:
      - hanzo-sse-test

  # Hanzo Volume Server
  hanzo-volume:
    image: chrislusf/hanzo:latest
    ports:
      - "8080:8080"
    command:
      - volume
      - -master=hanzo-master:9333
      - -port=8080
      - -ip=hanzo-volume
      - -publicUrl=hanzo-volume:8080
      - -dir=/data
      - -max=100
    depends_on:
      - hanzo-master
    volumes:
      - hanzo-volume-data:/data
    networks:
      - hanzo-sse-test

  # Hanzo Filer with S3 API and KMS configuration
  hanzo-filer:
    image: chrislusf/hanzo:latest
    ports:
      - "8888:8888"  # Filer HTTP
      - "18888:18888" # Filer gRPC  
      - "8333:8333"  # S3 API
    command:
      - filer
      - -master=hanzo-master:9333
      - -port=8888
      - -port.grpc=18888
      - -ip=hanzo-filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/hanzo/s3.json
    depends_on:
      - hanzo-master
      - hanzo-volume
      - openbao
    volumes:
      - ./s3_kms.json:/etc/hanzo/s3.json
      - hanzo-filer-data:/data
    networks:
      - hanzo-sse-test

volumes:
  openbao-data:
  hanzo-master-data:
  hanzo-volume-data:
  hanzo-filer-data:

networks:
  hanzo-sse-test:
    name: hanzo-sse-test
