services:
  hanzo-master:
    build:
      context: ../../../docker
      dockerfile: Dockerfile.local
    image: hanzo:local
    container_name: hanzo-spark-master
    ports:
      - "9333:9333"
      - "19333:19333"
    command: "master -ip=hanzo-master -ip.bind=0.0.0.0 -port=9333 -port.grpc=19333 -volumeSizeLimitMB=50 -defaultReplication=000 -peers=none"
    networks:
      - hanzo-spark
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  hanzo-volume:
    image: hanzo:local
    container_name: hanzo-spark-volume
    ports:
      - "8080:8080"
      - "18080:18080"
    command: "volume -master=hanzo-master:9333 -ip=hanzo-volume -ip.bind=0.0.0.0 -port=8080 -port.grpc=18080 -publicUrl=hanzo-volume:8080 -max=100 -dir=/data -preStopSeconds=1"
    volumes:
      - hanzo-volume-data:/data
    depends_on:
      hanzo-master:
        condition: service_healthy
    networks:
      - hanzo-spark
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  hanzo-filer:
    image: hanzo:local
    container_name: hanzo-spark-filer
    ports:
      - "8888:8888"
      - "18888:18888"
    command: "filer -master=hanzo-master:9333 -ip=hanzo-filer -ip.bind=0.0.0.0 -port=8888 -port.grpc=18888"
    depends_on:
      hanzo-master:
        condition: service_healthy
      hanzo-volume:
        condition: service_healthy
    networks:
      - hanzo-spark
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  spark-tests:
    image: maven:3.9-eclipse-temurin-17
    container_name: hanzo-spark-tests
    volumes:
      - .:/workspace
      - ./.m2:/root/.m2
    working_dir: /workspace
    environment:
      - SEAWEEDFS_TEST_ENABLED=true
      - SEAWEEDFS_FILER_HOST=hanzo-filer
      - SEAWEEDFS_FILER_PORT=8888
      - SEAWEEDFS_FILER_GRPC_PORT=18888
      - HADOOP_HOME=/tmp
      # Disable Java DNS caching to ensure fresh DNS lookups
      - MAVEN_OPTS=-Dsun.net.inetaddr.ttl=0 -Dnetworkaddress.cache.ttl=0
      - SPARK_SUBMIT_OPTS=-Dfs.s3.impl.disable.cache=true
    command: sh -c "sleep 30 && mvn clean test"
    depends_on:
      hanzo-filer:
        condition: service_healthy
    networks:
      - hanzo-spark
    mem_limit: 4g
    cpus: 2

networks:
  hanzo-spark:
    driver: bridge

volumes:
  hanzo-volume-data:

