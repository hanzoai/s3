# A sample TOML config file for Hanzo filer store
# Used with "s3 filer" or "s3 server -filer"
# Put this file to one of the location, with descending priority
#    ./filer.toml
#    $HOME/.s3/filer.toml
#    /etc/hanzo/filer.toml

####################################################
# Customizable filer server options
####################################################
[filer.options]
# with http DELETE, by default the filer would check whether a folder is empty.
# recursive_delete will delete all sub folders and files, similar to "rm -Rf"
recursive_delete = false
#max_file_name_length = 255
# for S3: how long to wait before deleting an empty folder.
# increase this if using tools like Spark that create temporary directories.
#s3.empty_folder_cleanup_delay = "2m"

####################################################
# The following are filer store options
####################################################

[zapdb]
# local on disk, transactional LSM-tree key-value store.
# default single-machine store, fast and scalable.
enabled = true
dir = "./filerzdb"                     # directory to store zapdb files

[sqlite]
# local on disk, embedded SQL store. each bucket has its own table.
# requires: go build -tags sqlite
enabled = false
dbFile = "./filer.db"                # sqlite db file

[rocksdb]
# local on disk, similar to zapdb.
# since it is using a C wrapper, you need to install rocksdb and build it by yourself.
# requires: go build -tags rocksdb
enabled = false
dir = "./filerrdb"                    # directory to store rocksdb files

[foundationdb]
# FoundationDB provides ACID transactions and horizontal scalability.
# requires: go build -tags foundationdb
enabled = false
cluster_file = "/etc/foundationdb/fdb.cluster"
# api_version = 740
# timeout = "5s"
# directory_prefix = "hanzo"
# For bulk ingestion, enable batching: batch_enabled = true

##########################
##########################
# To add a path-specific filer store:
#
# 1. Add a name following the store type separated by a dot ".". E.g., zapdb.tmp
# 2. Add a location configuration. E.g., location = "/tmp/"
# 3. Copy and customize all other configurations.
#     Make sure they are not the same if using the same store type!
# 4. Set enabled to true
##########################
[zapdb.tmp]
enabled = false
location = "/tmp/"
dir = "/tmp/filerzdb"
