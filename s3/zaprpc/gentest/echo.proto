syntax = "proto3";
package gentest;
option go_package = "github.com/hanzoai/s3/s3/zaprpc/gentest";

// Minimal unary service to prove protoc-gen-zap's service-stub generation
// end-to-end over the real ZAP transport (see service_test.go).
message PingRequest {
  string msg = 1;
  int32 seq = 2;
  repeated string tags = 3;
}
message PingResponse {
  string msg = 1;
  int32 seq = 2;
}

service Echo {
  rpc Ping(PingRequest) returns (PingResponse);
}
