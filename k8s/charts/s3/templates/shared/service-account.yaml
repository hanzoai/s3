{{- include "hanzo.compat" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hanzo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.global.s3.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ template "hanzo.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: {{ .Values.global.s3.automountServiceAccountToken }}