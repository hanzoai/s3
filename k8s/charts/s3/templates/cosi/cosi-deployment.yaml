{{- include "hanzo.compat" . -}}
{{- if .Values.cosi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hanzo.fullname" . }}-objectstorage-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ template "hanzo.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: objectstorage-provisioner
spec:
  replicas: {{ .Values.cosi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ template "hanzo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: objectstorage-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ template "hanzo.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: objectstorage-provisioner
      {{ with .Values.podLabels }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cosi.podLabels }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
      {{ with .Values.podAnnotations }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cosi.podAnnotations }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ default .Values.global.s3.restartPolicy .Values.cosi.restartPolicy }}
      {{- if .Values.cosi.affinity }}
      affinity:
        {{ tpl .Values.cosi.affinity . | nindent 8 | trim }}
      {{- end }}
      {{- if .Values.cosi.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{ tpl .Values.cosi.topologySpreadConstraint . | nindent 8 | trim }}
      {{- end }}
      {{- if .Values.cosi.tolerations }}
      tolerations:
        {{ tpl .Values.cosi.tolerations . | nindent 8 | trim }}
      {{- end }}
      {{- include "hanzo.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 10
      {{- if .Values.cosi.priorityClassName }}
      priorityClassName: {{ .Values.cosi.priorityClassName | quote }}
      {{- end }}
      enableServiceLinks: false
      serviceAccountName: {{ include "hanzo.componentName" (list . "objectstorage-provisioner") }}
      {{- if .Values.cosi.initContainers }}
      initContainers:
        {{ tpl .Values.cosi.initContainers . | nindent 8 | trim }}
      {{- end }}
      {{- if .Values.cosi.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.cosi.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: hanzo-cosi-driver
          image: "{{ .Values.cosi.image }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.global.s3.imagePullPolicy }}
          env:
            - name: DRIVERNAME
              value: "{{ .Values.cosi.driverName }}"
            - name: ENDPOINT
              {{- if .Values.cosi.endpoint }}
              value: "{{ .Values.cosi.endpoint }}"
              {{- else if .Values.s3.ingress.enabled }}
              value: "{{ printf "https://%s" .Values.s3.ingress.host }}"
              {{- else if .Values.s3.enabled }}
              value: "{{ printf "https://%s.%s.svc" (include "hanzo.componentName" (list . "s3")) .Release.Namespace }}"
              {{- else }}
              value: "{{ printf "https://%s.%s.svc" (include "hanzo.componentName" (list . "filer")) .Release.Namespace }}"
              {{- end }}
            {{- with .Values.cosi.region }}
            - name: REGION
              value: "{{ . }}"
            {{- end }}
            - name: SEAWEEDFS_FILER
              value: "{{ include "hanzo.componentName" (list . "filer") }}:{{ .Values.filer.grpcPort }}"
            {{- if .Values.global.s3.enableSecurity }}
            - name: WEED_GRPC_CLIENT_KEY
              value: /usr/local/share/ca-certificates/client/tls.key
            - name: WEED_GRPC_CLIENT_CERT
              value: /usr/local/share/ca-certificates/client/tls.crt
            - name: WEED_GRPC_CA
              value: /usr/local/share/ca-certificates/client/ca.crt
            {{- end }}
            {{- $mergedExtraEnvironmentVars := dict }}
            {{- include "hanzo.mergeExtraEnvironmentVars" (dict "global" .Values.global.s3 "component" .Values.cosi "target" $mergedExtraEnvironmentVars) }}
            {{- range $key := keys $mergedExtraEnvironmentVars | sortAlpha }}
            {{- $value := index $mergedExtraEnvironmentVars $key }}
            - name: {{ $key }}
            {{- if kindIs "string" $value }}
              value: {{ tpl $value $ | quote }}
            {{- else }}
              valueFrom:
                {{ toYaml $value | nindent 16 | trim }}
            {{- end -}}
            {{- end }}
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
            {{- if .Values.cosi.enableAuth }}
            - mountPath: /etc/sw
              name: config-users
              readOnly: true
            {{- end }}
            {{- if include "hanzo.securityConfigEnabled" . }}
            - name: security-config
              readOnly: true
              mountPath: /etc/hanzo/security.toml
              subPath: security.toml
            {{- end }}
            {{- if .Values.global.s3.enableSecurity }}
            - name: ca-cert
              readOnly: true
              mountPath: /usr/local/share/ca-certificates/ca/
            - name: master-cert
              readOnly: true
              mountPath: /usr/local/share/ca-certificates/master/
            - name: volume-cert
              readOnly: true
              mountPath: /usr/local/share/ca-certificates/volume/
            - name: filer-cert
              readOnly: true
              mountPath: /usr/local/share/ca-certificates/filer/
            - name: client-cert
              readOnly: true
              mountPath: /usr/local/share/ca-certificates/client/
            {{- end }}
            {{ tpl .Values.cosi.extraVolumeMounts . | nindent 12 | trim }}
          {{- with .Values.cosi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: hanzo-cosi-sidecar
          image: "{{ .Values.cosi.sidecar.image }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.global.s3.imagePullPolicy }}
          args:
            - {{ printf "--v=%s" (default "5" .Values.cosi.sidecar.logLevel) }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
          {{- with .Values.cosi.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.cosi.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.cosi.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
      {{- if .Values.cosi.sidecars }}
      {{- include "hanzo.tplvalues.render" (dict "value" .Values.cosi.sidecars "context" $) | nindent 8 }}
      {{- end }}
      volumes:
        - name: socket
          emptyDir: {}
        {{- if .Values.cosi.enableAuth }}
        - name: config-users
          secret:
            defaultMode: 420
            {{- if .Values.cosi.existingConfigSecret }}
            secretName: {{ .Values.cosi.existingConfigSecret }}
            {{- else }}
            secretName: {{ include "hanzo.fullname" . }}-s3-secret
            {{- end }}
        {{- end }}
        {{- if include "hanzo.securityConfigEnabled" . }}
        - name: security-config
          configMap:
            name: {{ include "hanzo.fullname" . }}-security-config
        {{- end }}
        {{- if .Values.global.s3.enableSecurity }}
        - name: ca-cert
          secret:
            secretName: {{ include "hanzo.fullname" . }}-ca-cert
        - name: master-cert
          secret:
            secretName: {{ include "hanzo.fullname" . }}-master-cert
        - name: volume-cert
          secret:
            secretName: {{ include "hanzo.fullname" . }}-volume-cert
        - name: filer-cert
          secret:
            secretName: {{ include "hanzo.fullname" . }}-filer-cert
        - name: client-cert
          secret:
            secretName: {{ include "hanzo.fullname" . }}-client-cert
        {{- end }}
        {{ tpl .Values.cosi.extraVolumes . | indent 8 | trim }}
      {{- if .Values.cosi.nodeSelector }}
      nodeSelector:
        {{ tpl .Values.cosi.nodeSelector . | indent 8 | trim }}
      {{- end }}
{{- end }}
